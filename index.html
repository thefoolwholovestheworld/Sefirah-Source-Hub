<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sefirah Source Hub</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b3fd0'/%3E%3Ctext x='32' y='46' font-size='40' font-family='Arial,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f2;--c:#fff;--t:#1d1d1f;--m:#666;--a:#5b3fd0;--b:#ddd;--ok:#1a7f37;--w:#b26a00;--e:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#141417;--c:#1e1e23;--t:#eee;--m:#9a9aa3;--a:#9b86ff;--b:#33333a;--ok:#4cc26a;--w:#f0a63c;--e:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{padding:12px 16px;font-weight:700;font-size:18px}nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--b)}
nav button{border:0;background:none;color:var(--m);padding:10px 12px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--a);border-color:var(--a);font-weight:600}main{max-width:980px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin:8px 0}
input,select,textarea,button.b{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);max-width:100%}
textarea{width:100%;min-height:130px;font-family:monospace;font-size:12px}input[type=text],input:not([type]),input[type=url]{width:100%}
button.b{cursor:pointer;background:var(--a);color:#fff;border-color:var(--a)}button.b.s{background:var(--c);color:var(--t);border-color:var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
label{display:block;font-size:13px;color:var(--m);margin-top:8px}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--b);color:var(--m);margin-right:4px}
.ok{color:var(--ok)}.w{color:var(--w)}.e{color:var(--e)}pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto;max-height:55vh;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:r 1s linear infinite;vertical-align:middle}@keyframes r{to{transform:rotate(360deg)}}
dialog{width:min(900px,95vw);background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:10px}small{color:var(--m)}
.ico{width:20px;height:20px;border-radius:4px;vertical-align:middle;margin-right:6px;background:var(--b);object-fit:contain}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 8px}.sh .ico{margin:0}

.steps{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}.steps span{flex:1 1 120px;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--b);color:var(--m);background:var(--c)}.steps span b{color:var(--a)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.hero .card{margin:0}.hero .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--a);color:#fff;font-weight:700;margin-right:6px}
.hint{display:block;font-size:12px;color:var(--m);margin:2px 0 4px}details.help{margin:6px 0;font-size:13px;color:var(--m)}details.help summary{cursor:pointer;color:var(--a)}
.todo{list-style:none;padding:0}.todo li{padding:6px 0;border-bottom:1px solid var(--b)}.todo input{margin-right:8px}
h2.st{font-size:16px;margin:16px 0 4px}h2.st span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--a);color:#fff;font-size:13px;margin-right:6px}
.fx{display:block;margin:3px 0 8px;font-size:13px;color:var(--t);background:var(--bg);border-left:3px solid var(--a);padding:5px 9px;border-radius:4px}ul .fx{margin-left:-4px}
.fcard{border-left:3px solid var(--a)}.fcard textarea{min-height:90px}.fcard .why{display:block;font-size:13px;color:var(--e);margin:4px 0}</style></head><body>
<header><span id="siteLogo" role="button" tabindex="0" title="Actualiser le site" aria-label="Actualiser le site" style="cursor:pointer" onclick="location.reload()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();location.reload()}">📚</span> Sefirah Source Hub <small>— sources Lua pour le plugin KOReader Sefirah</small></header>
<nav id="nav"></nav>
<main>
<section id="creer">
<div class="card"><h2 style="margin:0 0 4px">Créer une source à partir d'une adresse</h2>
<p style="margin:0 0 8px;color:var(--m)">Colle l'adresse du site : l'IA lit l'accueil, une fiche et un chapitre, devine les réglages, génère le fichier <code>.lua</code> et le teste.</p>
<div class="row"><input id="cu" type="url" placeholder="https://exemple.com" aria-label="Adresse du site" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="b" id="cai">✨ Générer le .lua</button></div>
<div id="cmsg"></div></div>
<div id="cout"></div>

</section>

<section id="catalogue"><div class="row"><input id="cq" placeholder="Rechercher un nom…"><select id="cl"><option value="">Toutes langues</option></select><select id="ct"><option value="">Tous types</option><option>novel</option><option>manga</option></select><select id="cs"><option value="">Tout statut</option><option>non vérifié</option><option>testé</option></select></div>
<small id="cn"></small><div class="grid" id="cg"></div></section>


</main>
<dialog id="dlg"><div class="row"><b id="dt"></b><button class="b s" onclick="dlg.close()">Fermer</button></div><pre id="dc"></pre></dialog>
<script>
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const TABS=[['creer','Créer'],['catalogue','Catalogue']];
const nav=$('#nav');TABS.forEach(([id,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>show(id);b.dataset.id=id;nav.append(b)});
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==id));nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id==id));location.hash=id}
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{alert('Stockage local indisponible')}}};
async function cp(t,b){try{await navigator.clipboard.writeText(t);b.textContent='Copié ✔'}catch{prompt('Copie :',t)}}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;a.click()}
function viewCode(t,c){$('#dt').textContent=t;$('#dc').textContent=c;dlg.showModal()}
// ---------- réseau
const PROXY='https://sefirah-source-hub.ayman-mr1.workers.dev';
async function getPage(url){const px=PROXY;let err;
 try{const r=await fetch(url);return {status:r.status,text:await r.text()}}catch(e){err=e}
 const r=await fetch(px+'?url='+encodeURIComponent(url));return {status:r.status,text:await r.text()}}
const blocked=p=>(p.status==403||p.status==503||p.status==429)&&/cloudflare|just a moment|captcha|attention required/i.test(p.text);
const dom=h=>new DOMParser().parseFromString(h,'text/html');
// ---------- icônes des sites (favicon) : service de favicons, puis /favicon.ico du site, sinon masquée
const ico=(site,n=20)=>{let o='';try{o=new URL(site).origin}catch{}
 if(!o)return '';
 return `<img class="ico" width="${n}" height="${n}" alt="" loading="lazy" referrerpolicy="no-referrer" src="https://www.google.com/s2/favicons?sz=64&amp;domain_url=${encodeURIComponent(o)}" data-fb="${H(o+'/favicon.ico')}">`};
const hookIco=r=>r.querySelectorAll('img.ico').forEach(i=>i.addEventListener('error',()=>{const f=i.dataset.fb;if(!i.dataset.t&&f){i.dataset.t=1;i.src=f}else i.style.visibility='hidden'}));
// ---------- catalogue
let SRC=[];
fetch('sources/manifest.json').then(r=>r.json()).then(j=>{SRC=j.sources;[...new Set(SRC.map(s=>s.lang))].sort().forEach(l=>$('#cl').append(new Option(l,l)));cat()}).catch(()=>$('#cn').textContent='Manifeste introuvable (ouvre le site via GitHub Pages ou un serveur local).');
function cat(){const q=$('#cq').value.toLowerCase(),l=$('#cl').value,t=$('#ct').value,s=$('#cs').value;
 const L=SRC.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!l||x.lang==l)&&(!t||x.type==t)&&(!s||x.status==s));
 $('#cn').textContent=L.length+' source(s)';
 $('#cg').innerHTML=L.map(x=>`<div class="card">${ico(x.site)}<b>${H(x.name)}</b> <small>v${H(x.version)}</small><br><span class="tag">${H(x.lang)}</span><span class="tag">${H(x.type)}</span><span class="tag">${H(x.license)}</span><span class="tag ${x.status=='testé'?'ok':'w'}">${H(x.status)}</span><br><small><a href="${H(x.site)}" target="_blank" rel="noopener">${H(x.site)}</a><br>Dernière vérif. : ${x.lastCheck||'jamais'}</small>
 <div class="row"><button class="b s" data-a="v" data-i="${x.id}">Code</button><button class="b s" data-a="d" data-i="${x.id}">Télécharger</button><button class="b s" data-a="c" data-i="${x.id}">Copier le lien</button></div></div>`).join('');hookIco($('#cg'))}
['cq','cl','ct','cs'].forEach(i=>$('#'+i).oninput=cat);
$('#cg').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const x=SRC.find(s=>s.id==b.dataset.i);
 if(b.dataset.a=='c'){const u=new URL(x.file,location.href).href;try{await navigator.clipboard.writeText(u);b.textContent='Copié ✔'}catch{prompt('Lien :',u)}return}
 const t=await (await fetch(x.file)).text();b.dataset.a=='v'?viewCode(x.id+'.lua',t):dl(x.id+'.lua',t)};
// ---------- créer : une adresse -> IA -> .lua
const NEWCFG=()=>({name:'',lang:'fr',ver:'0.1.0',type:'novel',search:'',list:'',chap:'',cont:'',img:'',rev:false,next:false,nkNovel:'',nkChap:'',nkPara:'',nkText:'',nkContent:'',nkList:'',apiChap:'',apiSearch:'',filters:[],browse:''});
let CFG=NEWCFG();
const siteBase=()=>{try{return new URL($('#cu').value.trim()).origin}catch{return ''}};
// cfg() : la configuration « propre » utilisée pour générer le .lua et pour les tests (filtres et adresse validés)
const cfg=()=>{const base=siteBase();return {...CFG,name:CFG.name||'MaSource',lang:CFG.lang||'multi',ver:CFG.ver||'0.1.0',base,filters:cleanFilters(CFG.filters),browse:chkBrowse(CFG.browse,base).ok}};
function applyCfg(o){
 if(!o||typeof o!='object')return;
 if(o.type=='novel'||o.type=='manga')CFG.type=o.type;
 if(typeof o.name=='string'&&o.name&&o.name.length<41)CFG.name=o.name;
 if(/^([a-z]{2,3}|multi)$/.test(o.lang||''))CFG.lang=o.lang;
 if(typeof o.search=='string'&&o.search.includes('{q}')&&/^https?:\/\//.test(o.search))CFG.search=o.search;
 ['list','chap'].forEach(k=>{if(typeof o[k]=='string'&&o[k].length>1&&o[k].length<80)CFG[k]=o[k]});
 if(tok(o.cont))CFG.cont=o.cont;if(tok(o.img))CFG.img=o.img;
 if(o.rev===0||o.rev===1||o.rev==='0'||o.rev==='1')CFG.rev=String(o.rev)==='1';
 applyAiFilters(o)}
// ---------- FILTRES : nettoyage strict, détection, adresse de liste
// sf / sid / skey : textes courts sans antislash ni guillemets (le .lua généré n'a jamais besoin d'échappement)
const sf=(s,n)=>String(s??'').replace(/[\\\u0000-\u001f\u007f]/g,' ').replace(/"/g,"'").replace(/\s+/g,' ').trim().slice(0,n);
const sid=s=>String(s??'').replace(/[\\",{}\u0000-\u001f\u007f]/g,'').trim().slice(0,60);
const skey=s=>String(s??'').replace(/\[\]$/,'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,30);
const humanize=s=>{s=String(s||'').replace(/[_-]+/g,' ').trim();return s?s[0].toUpperCase()+s.slice(1):s};
const WHERE=['both','browse','search'];
// vérifie UN filtre : renvoie {ok:filtre propre ou null, why:pourquoi refusé, note:remarque}
function fixFilter(f){
 const r={ok:null,why:'',note:''};
 if(!f||typeof f!='object'){r.why='Ce filtre est illisible.';return r}
 const key=String(f.key??'').trim();
 if(!/^[A-Za-z0-9_-]{1,30}$/.test(key)){r.why="Le « mot dans l'adresse » doit faire 1 à 30 caractères : lettres sans accent, chiffres, - ou _ (exemple : genre).";return r}
 if(key=='page'||key=='q'){r.why="Les mots « page » et « q » sont déjà utilisés par le Hub : choisis-en un autre (exemple : genre).";return r}
 const multi=!!f.multi,seen=new Set();let o=[];
 (Array.isArray(f.options)?f.options:[]).forEach(x=>{if(!x||typeof x!='object')return;const id=sid(x.id),lb=sf(x.label,40)||id;if(seen.has(id)||!(id||lb))return;seen.add(id);o.push({id,label:lb||'Tous'})});
 if(multi)o=o.filter(x=>x.id&&x.id!='all');
 if(!o.length){r.why="Ajoute au moins un choix : une ligne par choix, par exemple « action = Action »."+(multi?" (Avec « plusieurs choix », « all » et les valeurs vides ne servent à rien.)":'');return r}
 if(o.length>60){r.note='Seuls les 60 premiers choix sont gardés.';o=o.slice(0,60)}
 const want=String(f.def??f.default??'').trim();let def='';
 if(!multi)def=o.some(x=>x.id==want)?want:o.some(x=>x.id=='all')?'all':o.some(x=>x.id=='')?'':o[0].id;
 r.ok={key,label:sf(f.label,40)||humanize(key),default:def,multi,where:WHERE.includes(f.where)?f.where:'both',join:f.join=='comma'?'comma':'rep',options:o};
 return r}
// liste de filtres propres : 8 maximum, un mot d'adresse = un seul filtre
function cleanFilters(a){const out=[],ks=new Set();
 (Array.isArray(a)?a:[]).forEach(f=>{if(out.length>=8)return;const r=fixFilter(f);if(r.ok&&!ks.has(r.ok.key)){ks.add(r.ok.key);out.push(r.ok)}});return out}
const mergeF=(a,b)=>{const m=[...(a||[])];(b||[]).forEach(f=>{if(!m.some(x=>x.key==f.key))m.push(f)});return m.slice(0,8)};
const joinOf=fl=>{const o={};(fl||[]).forEach(f=>{if(f.multi)o[f.key]=f.join||'rep'});return o};
// vérifie l'adresse de liste : renvoie {ok:adresse ou '', why:explication}
function chkBrowse(s,base){s=String(s??'').trim();if(!s)return{ok:'',why:''};
 if(s.length>300||/[\s"\\\u0000-\u001f]/.test(s)||!/^https?:\/\//i.test(s))return{ok:'',why:"L'adresse doit commencer par https://, sans espace ni guillemet."};
 const t=s.replace(/\{[\w-]+\}/g,'x');
 if(/[{}]/.test(t))return{ok:'',why:"Un mot entre accolades est mal écrit : utilise seulement des lettres, chiffres, - ou _ (exemple : {genre})."};
 try{const u=new URL(t);if(base&&u.origin!=base)return{ok:'',why:"Cette adresse n'est pas sur le même site que celui collé tout en haut."}}catch{return{ok:'',why:'Adresse illisible.'}}
 return{ok:s,why:''}}
// construit l'adresse de la liste (même règles que la fonction expand du .lua généré)
// valeur vide ou « all » => le paramètre (ou le morceau d'adresse) est retiré
function expandUrl(tpl,sel,term,page,join){
 tpl=String(tpl||'').replace(/#.*$/,'');
 const m=tpl.match(/^(https?:\/\/[^\/?]+)(.*)$/),origin=m?m[1]:'',rest=m?m[2]:tpl,qi=rest.indexOf('?'),path=qi<0?rest:rest.slice(0,qi),query=qi<0?'':rest.slice(qi+1);
 const fv=k=>{const v=sel&&sel[k];return v==null||v===''||v==='all'?null:String(v)};
 const sub=s=>{let ok=true;const r=s.replace(/\{([\w-]+)\}/g,(x,k)=>{if(k=='page')return String(page||1);if(k=='q')return encodeURIComponent(term||'');const v=fv(k);if(v==null){ok=false;return ''}return v.split(',').filter(Boolean).map(encodeURIComponent).join(',')});return [r,ok]};
 const segs=[];path.split('/').forEach(s=>{const [r,ok]=sub(s);if(ok)segs.push(r)});
 let out=origin+segs.join('/');const ps=[];
 if(query)query.split('&').forEach(p=>{const mm=p.match(/^([^=]*)=\{([\w-]+)\}$/),k=mm&&mm[2],v=k&&k!='page'&&k!='q'?fv(k):null;
  if(v&&v.includes(',')&&join&&join[k]=='rep')v.split(',').filter(Boolean).forEach(x=>ps.push(mm[1]+'='+encodeURIComponent(x)));
  else{const [r,ok]=sub(p);if(ok)ps.push(r)}});
 if(ps.length)out+='?'+ps.join('&');return out}
// ---- détection automatique des filtres d'une page (le HTML est une donnée non fiable : tout est nettoyé)
const SKIPN=/^(page|paged|pg|p|per_?page|perpage|limit|offset|q|s|search|keyword|query|term|csrf|_token|nonce|submit|action|lang|language)$/i;
const NOALL=/^(tous|toutes|tout|all|any|--?|—|…|\.\.\.|choisir.*|select.*|sélectionner.*)$/i;
const PGP=/^(page|paged|pg|p|pagina|pageno)$/i,NOQ=/^(q|s|search|keyword|query|term|k)$/i;
function detectFilters(d,org,pageUrl){
 const list=[],keys=new Set(),pu=pageUrl||org+'/';
 let page0=org+'/';try{const x=new URL(pu,org+'/');if(x.origin==org)page0=x.origin+x.pathname}catch{}
 const add=f=>{if(list.length>=8)return;if(f.param&&list.some(x=>x.param==f.param&&x.style==f.style&&x.base==f.base))return;
  let k=f.key,b=k.slice(0,27),n=2;while(keys.has(k))k=b+n++;f.key=k;keys.add(k);f.org=org;list.push(f)};
 const mk=(raw,label,opts,multi,extra)=>{const key=skey(raw);if(!key||SKIPN.test(key))return;
  const seen=new Set();let o=[];
  opts.forEach(x=>{const id=sid(x.id),lb=sf(x.label,40)||id;if(seen.has(id)||!(id||lb))return;seen.add(id);o.push({id,label:lb})});
  let def='';
  if(multi)o=o.filter(x=>x.id&&x.id!='all');
  else{const so=/sort|order|tri|classement/i.test(key);
   o=o.map(x=>x.id===''?{id:'all',label:(!x.label||NOALL.test(x.label))?(so?'Par défaut':'Tous'):x.label}:x);
   const dd=new Set();o=o.filter(x=>x.id!='all'||(!dd.has('a')&&dd.add('a')));
   if(!o.some(x=>x.id=='all'))o.unshift({id:'all',label:so?'Par défaut':'Tous'});
   def=extra.sel&&o.some(x=>x.id==extra.sel)?extra.sel:'all'}
  if(o.filter(x=>x.id&&x.id!='all').length<2)return;
  const {sel,...ex}=extra;
  add({key,label:sf(label,40)||humanize(key),def,multi,where:'both',join:'rep',options:o.slice(0,60),...ex})};
 const labelFor=el=>{let t='';const id=el.id;if(id){try{const l=d.querySelector('label[for="'+CSS.escape(id)+'"]');if(l)t=l.textContent}catch{}}
  if(!t){const l=el.closest('label');if(l)t=l.textContent}return sf(t,40)};
 const formInfo=el=>{const f=el.closest('form');if(!f)return{style:'query',base:page0};
  if(String(f.getAttribute('method')||'get').toLowerCase()!='get')return{style:'',base:''};
  try{const x=new URL(f.getAttribute('action')||pu,pu);if(x.origin!=org)return{style:'',base:''};return{style:'query',base:x.origin+x.pathname}}catch{return{style:'',base:''}}};
 // 1) listes déroulantes <select name="...">
 d.querySelectorAll('select[name]').forEach(s=>{const raw=s.getAttribute('name')||'';
  const opts=[...s.querySelectorAll('option')].map(o=>({id:o.getAttribute('value')??o.textContent,label:o.textContent}));
  const so=s.querySelector('option[selected]'),fi=formInfo(s);
  mk(raw,labelFor(s)||humanize(skey(raw)),opts,s.hasAttribute('multiple'),{param:raw,sel:so?sid(so.getAttribute('value')??''):'',...fi})});
 // 2) groupes de cases à cocher / boutons radio de même name
 const g={};d.querySelectorAll('input[type=checkbox][name],input[type=radio][name]').forEach(i=>{const n=i.getAttribute('name');(g[n]=g[n]||[]).push(i)});
 Object.entries(g).forEach(([raw,arr])=>{if(arr.length<2)return;
  const lg=arr[0].closest('fieldset')?.querySelector('legend');
  mk(raw,sf(lg?.textContent,40)||humanize(skey(raw)),arr.map(i=>({id:i.getAttribute('value')??'',label:labelFor(i)||i.getAttribute('value')||''})),arr[0].type=='checkbox',{param:raw,sel:'',...formInfo(arr[0])})});
 // 3) liens répétés : ?genre=action  ou  /genre/action/
 const qg={},pg={};
 d.querySelectorAll('a[href]').forEach(a=>{let x;try{x=new URL(a.getAttribute('href'),org+'/')}catch{return}if(x.origin!=org)return;
  const t=sf((a.textContent||'').replace(/\(\s*\d+\s*\)\s*$/,''),40);
  [...x.searchParams].forEach(([k,v])=>{if(!v||v.length>40||SKIPN.test(skey(k))||/^\d{3,}$/.test(v))return;
   const e=qg[x.pathname+'|'+k]=qg[x.pathname+'|'+k]||{path:x.pathname,param:k,vals:new Map()};if(!e.vals.has(v))e.vals.set(v,t||v)});

        local a = html:find(open, p, true)
        local b = html:find(close, p, true)
        if not b then return nil end
        if a and a < b then
            if not html:sub(a + #open, a + #open):match("%w") then depth = depth + 1 end
            p = a + #open
        else
            if not html:sub(b + #close, b + #close):match("%w") then
                depth = depth - 1
                if depth == 0 then return html:sub(from, b - 1) end
            end
            p = b + #close
        end
    end
end

local function grab(html, cls)
    local pos = 1
    while true do
        local s, e, tn, attrs = html:find("<(%a%w*)(%s[^>]*)>", pos)
        if not s then return nil end
        local c = attr(attrs, "class")
        if c and c:find(cls, 1, true) then
            local out = inner(html, e + 1, tn)
            if out and #out > 50 then return out end
        end
        pos = e + 1
    end
end

local function parse_list(html)
    local out, idx = {}, {}
    for tag, inner_html in html:gmatch("(<a%s[^>]->)(.-)</a>") do
        local href = attr(tag, "href")
        if href and LISTP ~= "" and href:find(LISTP, 1, true) and not (CHAPP ~= "" and href:find(CHAPP, 1, true)) then
            local k = norm(href)
            local img = inner_html:match("<img[^>]->")
            local name = attr(tag, "title") or (img and attr(img, "alt"))
            if name and name ~= "" then name = dec(name) else name = txt(inner_html) end
            local cover = cover_of(img)
            local it = idx[k]
            if it then -- même œuvre déjà vue (autre lien, autre forme d'URL) : on complète seulement
                if it.name == "" and name ~= "" then it.name = name end
                if not it.cover and cover then it.cover = cover end
            else
                it = { name = name, path = rel(href), cover = cover }
                idx[k] = it
                out[#out+1] = it
            end
        end
    end
    local res = {}
    for _, it in ipairs(out) do if it.name ~= "" then res[#res+1] = it end end
    return res
end

local function meta(html, path)
    local t = html:match("<h1[^>]*>(.-)</h1>")
    local name = t and txt(t) or ""
    if name == "" then name = dec(html:match('property="og:title"[^>]-content="([^"]*)"') or "") end
    if name == "" then name = path end
    local og = html:match('property="og:description"[^>]-content="([^"]*)"')
        or html:match('content="([^"]*)"[^>]-property="og:description"')
        or html:match('name="description"[^>]-content="([^"]*)"') or ""
    og = dec(og)
    local summary = og
    -- description souvent tronquée (« … ») dans og:description : on cherche la version complète dans la page
    if og == "" or og:sub(-3) == "..." or og:sub(-3) == "…" or #og < 200 then
        local head = (og:gsub("%s+", " ")):sub(1, 25)
        for _, k in ipairs({ "synopsis", "summary", "description", "resume", "story", "desc" }) do
            local b = grab(html, k)
            if b and select(2, b:gsub("<a%s", "")) <= 3 then
                local d = para(b)
                if #d > #og and #d > 60 and #d < 4000 and (head == "" or (d:gsub("%s+", " ")):find(head, 1, true)) then
                    summary = d
                    break
                end
            end
        end
    end
    return { name = name, path = path,
        cover = abs(dec(html:match('property="og:image"[^>]-content="([^"]*)"'))),
        summary = summary, author = "", status = "", genres = {} }
end

// analyse de l'accueil (heuristiques)
async function analyzeHome(u){
 const p=await getPage(u);
 if(blocked(p))throw new Error('Site protégé (Cloudflare/CAPTCHA) : non contourné.');
 if(p.status>=400||p.text.length<300)throw new Error('Réponse vide ou erreur HTTP '+p.status);
 const d=dom(p.text),base=new URL(u).origin,seg={};
 d.querySelectorAll('a[href]').forEach(a=>{try{const x=new URL(a.getAttribute('href'),base);if(x.origin!=base)return;const s=x.pathname.split('/').filter(Boolean);if(s.length>=2){const k='/'+s[0]+'/';seg[k]=(seg[k]||0)+1}}catch{}});
 const top=Object.entries(seg).sort((a,b)=>b[1]-a[1]).slice(0,4);
 CFG.name=(d.querySelector('meta[property="og:site_name"]')?.content||d.title||'').trim().slice(0,40);
 const hl=(d.documentElement.getAttribute('lang')||'').slice(0,2).toLowerCase();if(/^[a-z]{2}$/.test(hl))CFG.lang=hl;
 const f=d.querySelector('form[action*=search],form[role=search]');
 if(f){const i=f.querySelector('input[name]');if(i)CFG.search=new URL(f.getAttribute('action')||'/',base).href+'?'+i.name+'={q}'}
 if(top[0])CFG.list=top[0][0];
 return {p,d}}

// ---------- mode Next.js (RSC) : même logique que le .lua généré
function rscStream(html){const out=[],re=/\.push\(\[1,"/g;let m;
 while((m=re.exec(html))){const i=m.index+m[0].length;let j=i;
  for(;j<html.length;j++){const ch=html[j];if(ch=='\\'){j++;continue}if(ch=='"')break}
  try{out.push(JSON.parse('"'+html.slice(i,j)+'"'))}catch{}
  re.lastIndex=j+1}
 return out.join('')}
function balanced(text,key){const n='"'+key+'":{',s=text.indexOf(n);if(s<0)return null;let d=0,str=false,esc=false;
 for(let i=s+n.length-1;i<text.length;i++){const c=text[i];
  if(str){if(esc)esc=false;else if(c=='\\')esc=true;else if(c=='"')str=false}
  else if(c=='"')str=true;else if(c=='{')d++;else if(c=='}'){d--;if(!d)return text.slice(s+n.length-1,i+1)}}
 return null}
function rscObjects(st){const r=[],seen=new Set(),re=/"([A-Za-z_]\w{2,40})":\{/g;let m;
 while((m=re.exec(st))&&seen.size<400){if(seen.has(m[1]))continue;seen.add(m[1]);const raw=balanced(st,m[1]);if(!raw||raw.length<80)continue;try{r.push([m[1],JSON.parse(raw)])}catch{}}
 return r}
const NK_TXT=['content','text','body','paragraph'];
function findParas(o,d=0){if(!o||typeof o!='object'||d>3)return null;
 for(const [k,v] of Object.entries(o)){
  if(Array.isArray(v)&&v.length>=5&&v.every(x=>x&&typeof x=='object'||typeof x=='string')){
   if(typeof v[0]=='string'&&v[0].length>10)return{para:k,text:''};
   const f0=v[0]||{},tk=Object.keys(f0).find(f=>typeof f0[f]=='string'&&f0[f].length>10&&NK_TXT.includes(f))||Object.keys(f0).find(f=>typeof f0[f]=='string'&&f0[f].length>40);
   if(tk)return{para:k,text:tk}}
  const r=(v&&typeof v=='object'&&!Array.isArray(v))?findParas(v,d+1):null;if(r)return r}
 return null}
function discoverChapter(objs){for(const [k,o] of objs){const p=findParas(o);if(p)return{nkChap:k,nkPara:p.para,nkText:p.text,nkContent:''};
  const lf=Object.entries(o).find(([f,v])=>typeof v=='string'&&v.length>1500&&/<p|\n\n/.test(v));if(lf)return{nkChap:k,nkPara:'',nkText:'',nkContent:lf[0]}}return null}
function discoverNovel(objs){const o=objs.find(([k,o])=>typeof o.title=='string'&&('description' in o||'synopsis' in o)&&(o.slug||o.coverImage||o.cover));return o?o[0]:null}
function discoverList(nov,pref){if(pref&&Array.isArray(nov[pref]))return pref;
 const ok=f=>Array.isArray(nov[f])&&nov[f].length>=3&&nov[f].every(x=>x&&x.slug&&(x.title||x.name));
 return Object.keys(nov).find(f=>/chap|episode|volume/i.test(f)&&ok(f))||Object.keys(nov).find(f=>!/genre|tag|categor|author|label|theme/i.test(f)&&ok(f))||null}

  bw&&!bw.includes('{page}')&&add('w','Filtres : l\'adresse de liste n\'a pas de {page} (seule la 1re page sera chargée)');
  const sel={};fl.forEach(f=>sel[f.key]=f.default);

  const url=expandUrl(tpl,sel,term,1,joinOf(fl)),what='« '+f.label+' = '+o.label+' »';
  try{const p=await getPage(url);

  catch(e){add('e','Filtres : la liste filtrée est injoignable ('+e.message+')')}};
 try{

  p.status<400?add('ok','Le site répond (HTTP '+p.status+')'):add('e','HTTP '+p.status);
  if(p.text.length<500)add('w','Page d\'accueil quasi vide ('+p.text.length+' car.)');

  const f=await getPage(abs(first)),fd=dom(f.text),t=fd.querySelector('h1')?.textContent.trim();

  fd.querySelector('meta[property="og:image"]')?add('ok','Fiche : couverture (og:image) trouvée'):add('w','Fiche : pas de couverture og:image');
  const og=fd.querySelector('meta[property="og:description"]')?.content||'';
  /(\.\.\.|…)\s*$/.test(og)&&add('w','Fiche : description tronquée dans og:description (le .lua cherche la version complète)');
  /&#x?[0-9a-f]+;/i.test(f.text)&&add('ok','Fiche : entités HTML numériques (&#x27;…) présentes, décodées par le .lua généré');
  const st=man?'':rscStream(f.text),nextSite=st.length>500,npath=(()=>{try{return new URL(first,base+'/').pathname.replace(/\/+$/,'')}catch{return first}})();

     try{const r=await getPage(base+g.replace('{slug}',slug).replace('{skip}','0'));if(r.status>=400)continue;const j=JSON.parse(r.text);
      const a=j.chapters||j.data||j.items||(Array.isArray(j)?j:[]),s=a.map(x=>x&&x.slug).filter(Boolean);

   if(!slugs.length&&!chHtml)add('e','Next.js : aucune liste de chapitres trouvée. Cherche l\'adresse API des chapitres dans DevTools › Network.');
   let html2=chHtml;

      set.browse=tz.tpl;set.filters=[...tz.used];add('ok','Adresse de liste avec filtres trouvée : '+tz.tpl);
      tz.used.filter(f=>!tz.made.includes(f)).forEach(f=>add('ok','Filtre « '+f.label+' » reconnu dans l\'adresse'));
      tz.made.forEach(f=>add('w','J\'ai créé le filtre « '+f.label+' » avec le seul choix vu dans l\'adresse : ajoute les autres choix dans « Réglages détectés › Filtres ».'));
      if(!tz.tpl.includes('{page}'))add('w',"Je n'ai pas vu de numéro de page dans l'adresse : si la liste a plusieurs pages, colle l'adresse de la page 2.")}}catch{}}}}
  if(type=='search'){
   if(word&&pageUrl){let u=pageUrl,hit=false;
    for(const w of [word,encodeURIComponent(word),word.replace(/ /g,'+'),word.replace(/ /g,'-'),encodeURIComponent(word).replace(/%20/g,'+')]){const i=u.toLowerCase().indexOf(w.toLowerCase());if(w&&i>=0){u=u.slice(0,i)+'{q}'+u.slice(i+w.length);hit=true;break}}
    if(hit){u=u.replace(/([?&](?:page|paged|p)=)\d+/i,'$1{page}').replace(/\/page\/\d+/,'/page/{page}');set.search=u;add('ok','Adresse de recherche trouvée : '+u)}
    else add('w',"Je ne retrouve pas « "+word+" » dans l'adresse. Copie l'adresse exacte de la page de résultats, juste après avoir cherché ce mot.")}
   else if(!set.search)add('w',"Pour trouver l'adresse de recherche, remplis aussi « Le mot que tu as cherché » et « L'adresse de la page de résultats ».")}}
 else if(type=='novel'){
  const t=d.querySelector('h1')?.textContent.trim();if(t)add('ok','Titre de l\'œuvre lu : « '+t.slice(0,50)+' »');else add('w',"Pas de titre en grand (<h1>) sur cette page : le titre pourra s'afficher comme l'adresse.");
  const g=chapGuess(L);
  if(g){set.chap=g.chap;set.rev=!!g.rev;add('ok','Liens de chapitres : ils contiennent « '+g.chap+' »');add('ok',g.rev?'Les chapitres sont listés du plus récent au plus ancien : je les remets dans l\'ordre.':'Les chapitres sont déjà dans l\'ordre.')}
  else if(st.length>500){const objs=rscObjects(st),nk=discoverNovel(objs);
   if(nk){const nov=objs.find(x=>x[0]==nk)[1],lf=discoverList(nov);set.next=true;set.nkNovel=nk;add('ok','Site de type Next.js : fiche reconnue (« '+nk+' »)');
    if(lf){set.nkList=lf;add('ok','Liste des chapitres trouvée dans le champ « '+lf+' »')}
    else add('w',"Les chapitres ne sont pas dans cette page : au prochain test, je chercherai toute seule l'adresse qui les donne.")}
   else add('e',"Je ne reconnais ni liste de chapitres ni fiche d'œuvre dans ce code. Vérifie que c'est bien la page d'UNE œuvre.")}
  else add('e',"Je ne vois aucun lien de chapitre dans ce code. Vérifie que c'est bien la page d'une œuvre avec sa liste de chapitres.")}
 else if(type=='chapter'){
  const cc=d?cands(d):[],im=imgCls(d),best=cc.find(x=>x.cls);
  if(best){set.type='novel';set.cont=best.cls;set.next=false;add('ok','Texte du chapitre trouvé dans « '+best.cls+' » ('+best.p+' paragraphes, '+best.len+' caractères)');if(best.len<500)add('w',"Le texte trouvé est court : c'est peut-être seulement un morceau du chapitre.")}
  else if(im[0]&&im[0][1]>=4){set.type='manga';set.img=im[0][0];add('ok','Chapitre en images (manga) : '+im[0][1]+' images'+(im[0][0]?' de classe « '+im[0][0]+' »':''))}
  else if(st.length>500){const dc=discoverChapter(rscObjects(st));
   if(dc){set.type='novel';set.next=true;Object.assign(set,dc);add('ok','Site de type Next.js : texte du chapitre trouvé dans « '+dc.nkChap+' »')}
   else add('e',"Je ne trouve pas le texte de ce chapitre dans le code. Vérifie que tu as copié la page d'un chapitre ouvert (avec le texte à l'écran).")}
  else add('e',"Je ne trouve ni texte ni images de chapitre dans ce code. Vérifie que tu as copié la page d'un chapitre ouvert.")}
 return{set,R,found}}
function initHelp(){
 const b=$('#h_go');if(!b)return;const sel=$('#h_type');
 const upd=()=>{const t=sel.value;$('#h_guide').textContent=HELPTXT[t];$('#h_extra').style.display=(t=='search'||t=='list')?'block':'none';$('#h_wordbox').style.display=t=='search'?'block':'none';
  $('#h_ul').textContent=t=='list'?"L'adresse de la page de la liste, avec le filtre appliqué (copie-la en haut du navigateur)":"L'adresse de la page de résultats (copie-la en haut du navigateur)";
  $('#h_url').placeholder=t=='list'?'https://exemple.com/novels?genre=action':'https://exemple.com/search?q=love'};
 sel.onchange=upd;upd();
 b.onclick=async()=>{
  const html=$('#h_src').value,out=$('#h_out'),type=sel.value;
  if(!html.trim()){out.innerHTML='<p class="w">Colle d\'abord le code de la page dans la grande case.</p>';return}
  readAdv();
  const {set,R,fatal,found}=analyzeSource(type,html,($('#h_word').value||'').trim(),($('#h_url').value||'').trim());
  if(fatal){out.innerHTML='<ul>'+R.map(r=>`<li class="${r[0]}">✘ ${H(r[1])}</li>`).join('')+'</ul>';return}
  PASTE[type]=html;applySet(set);FIXMSG=R;
  if(found&&found.list.length)PROP={list:found.list.filter(f=>!CFG.filters.some(x=>x.key==f.key)),browse:found.browse};
  b.disabled=true;b.textContent='Je reteste…';
  try{renderResult(await runTests(cfg()),LASTINFO,true)}catch(e){b.disabled=false;b.textContent='🔍 Analyser ce code';out.innerHTML='<p class="e">✘ '+H(e.message)+'</p>'}}}
$('#cai').onclick=generate;
$('#cu').addEventListener('keydown',e=>{if(e.key=='Enter')generate()});
show(TABS.some(t=>t[0]==location.hash.slice(1))?location.hash.slice(1):'creer');

<script>

(function(){

.rd .err{padding:14px;font:13px system-ui,sans-serif;color:#000}.rd .ld{padding:14px;font:13px system-ui,sans-serif;color:#444}`;
const st=document.createElement('style');st.textContent=css;document.head.append(st);
let dlg=document.getElementById('pv');
if(!dlg){dlg=document.createElement('dialog');dlg.id='pv';document.body.append(dlg)}

const enc=encodeURIComponent;
// ouvre une page ; si le site la refuse (anti-bot, erreur), utilise le code collé par l'utilisateur
async function pg(url,type){let p=null;try{p=await getPage(url)}catch{}
 const bad=!p||blocked(p)||p.status>=400;
 if(bad&&PASTE[type])return{status:200,text:PASTE[type],paste:true};
 if(bad&&type=='list')throw new Error("Je n'arrive pas à ouvrir la liste avec ce filtre. Sur le site, applique le même filtre, copie le code de la page et colle-le dans « 🆘 Ça ne marche pas ? » › « Une page de liste avec un filtre appliqué ».");
 if(!p)throw new Error("Le Hub n'arrive pas à ouvrir cette page.");
 return p}
const unnext=u=>{const m=u.match(/\/_next\/image\?url=([^&]+)/);return m?decodeURIComponent(m[1]):u};
const initials=n=>{const c=(n||'?').replace(/[^A-Z]/g,'');return c.length>=2?c.slice(0,2):(n||'?').slice(0,2).toUpperCase()};
const normP=(h,b)=>{try{return new URL(h,b+'/').pathname.replace(/\/+$/,'').toLowerCase()}catch{return String(h)}};
const relP=(h,b)=>{try{const u=new URL(h,b+'/');return u.pathname+u.search}catch{return h}};
function coverOf(img,b){if(!img)return'';
 for(const k of['data-src','data-lazy-src','data-original','src','srcset']){let u=img.getAttribute(k);
  if(k=='srcset'&&u)u=u.trim().split(/\s+/)[0];
  if(u&&!/^data:/.test(u)&&!/placeholder|blank/i.test(u))return unnext(new URL(u,b+'/').href)}return''}

// mêmes règles que parse_list du .lua généré
function listItems(doc,c){const out=[],idx={};
 doc.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href')||'';
  if(!c.list||!h.includes(c.list)||(c.chap&&h.includes(c.chap)))return;
  const k=normP(h,c.base),img=a.querySelector('img');
  let name=a.getAttribute('title')||(img&&img.getAttribute('alt'))||a.textContent;name=(name||'').trim().replace(/\s+/g,' ');
  const cover=coverOf(img,c.base);
  if(idx[k]){if(!idx[k].name&&name)idx[k].name=name;if(!idx[k].cover&&cover)idx[k].cover=cover}
  else{idx[k]={name,path:relP(h,c.base),cover};out.push(idx[k])}});
 return out.filter(x=>x.name)}

// charge la liste (accueil, adresse avec filtres ou recherche) avec la même adresse que celle du .lua ; sel = choix des filtres
async function loadList(c,term,sel){
 const J=joinOf(c.filters);let url,type;
 if(term){if(!c.search)throw new Error("Je n'ai pas encore l'adresse de recherche de ce site.");url=expandUrl(c.search,sel,term,1,J);type='search'}
 else if(c.browse){url=expandUrl(c.browse,sel,'',1,J);type='list'}
 else{url=c.base+'/';type='home'}
 const p=await pg(url,type);
 if(blocked(p))throw new Error('Site protégé (anti-bot) : aperçu impossible.');
 if(p.status>=400)throw new Error('HTTP '+p.status);
 return{items:listItems(dom(p.text),c),url,paste:!!p.paste}}

function metaOf(doc,path){
 const name=(doc.querySelector('h1')?.textContent||doc.querySelector('meta[property="og:title"]')?.content||path).trim();
 let sum=doc.querySelector('meta[property="og:description"]')?.content||doc.querySelector('meta[name="description"]')?.content||'';
 if(!sum||/(\.\.\.|…)$/.test(sum)||sum.length<200){const head=sum.replace(/\s+/g,' ').slice(0,25);
  for(const k of['synopsis','summary','description','resume','story','desc']){
   const e=[...doc.querySelectorAll('[class*="'+k+'"]')].find(x=>x.querySelectorAll('a').length<=3&&x.textContent.trim().length>60&&x.textContent.length<4000&&(!head||x.textContent.replace(/\s+/g,' ').includes(head)));
   if(e){sum=e.innerText||e.textContent;break}}}
 const cover=doc.querySelector('meta[property="og:image"]')?.content||'';
 return{name,summary:sum.trim(),cover}}

async function loadNovel(c,path){
 const url=new URL(path,c.base+'/').href,p=await pg(url,'novel'),doc=dom(p.text),m=metaOf(doc,path);
 let chs=[];
 if(c.next&&c.nkNovel){
  const st=rscStream(p.text),raw=balanced(st,c.nkNovel);let nov=null;try{nov=raw&&JSON.parse(raw)}catch{}
  if(nov){if(typeof nov.title=='string')m.name=nov.title;
   const d=nov.description||nov.synopsis;if(typeof d=='string'&&d[0]!='$')m.summary=d;
   const ci=nov.coverImage||nov.cover||nov.image;if(typeof ci=='string')m.cover=new URL(ci,c.base+'/').href;
   const base=path.replace(/\/+$/,'');
   if(c.apiChap){try{const slug=base.split('/').pop(),r=await getPage((/^https?:/.test(c.apiChap)?'':c.base)+c.apiChap.replace('{slug}',slug).replace('{skip}','0')),j=JSON.parse(r.text);
     const a=j.chapters||j.data||j.items||(Array.isArray(j)?j:[]);chs=a.filter(x=>x&&x.slug).map((x,i)=>({name:String(x.title||x.name||'Chapitre '+(i+1)),path:base+'/'+x.slug}))}catch{}}
   else if(c.nkList&&Array.isArray(nov[c.nkList]))chs=nov[c.nkList].filter(x=>x&&x.slug).map((x,i)=>({name:String(x.title||x.name||'Chapitre '+(i+1)),path:base+'/'+x.slug}))}}
 else{const seen={};
  doc.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href')||'';
   if(!c.chap||!h.includes(c.chap)||seen[normP(h,c.base)])return;seen[normP(h,c.base)]=1;
   let n=a.textContent.trim().replace(/\s+/g,' ')||a.getAttribute('title')||'Chapitre '+(chs.length+1);chs.push({name:n,path:relP(h,c.base)})});
  if(c.rev)chs.reverse()}
 return{...m,chapters:chs}}

async function loadChapter(c,path){
 const url=new URL(path,c.base+'/').href,p=await pg(url,'chapter');
 if(blocked(p))throw new Error('Page de lecture protégée (anti-bot).');
 if(p.status>=400)throw new Error('HTTP '+p.status);
 const doc=dom(p.text);
 if(c.type=='manga'){
  const im=[...doc.querySelectorAll('img')].filter(i=>!c.img||(i.className||'').includes(c.img)).map(i=>i.getAttribute('data-src')||i.getAttribute('data-lazy-src')||i.getAttribute('data-original')||i.getAttribute('src')).filter(u=>u&&!/^data:/.test(u)&&!/logo/.test(u)).map(u=>new URL(u,c.base+'/').href);
  if(!im.length)throw new Error('Aucune image de page trouvée.');
  return{images:[...new Set(im)]}}
 if(c.next&&(c.nkPara||c.nkContent)){
  const raw=balanced(rscStream(p.text),c.nkChap);let o=null;try{o=raw&&JSON.parse(raw)}catch{}
  if(o){let ps=[];
   if(c.nkPara&&Array.isArray(o[c.nkPara]))ps=o[c.nkPara].map(x=>typeof x=='string'?x:(x&&x[c.nkText])||'');
   else if(typeof o[c.nkContent]=='string')ps=o[c.nkContent].split(/\n+/);
   ps=ps.filter(x=>x&&x[0]!='$'&&x.trim());if(ps.length)return{paras:ps}}}
 const el=c.cont&&doc.querySelector('[class*="'+c.cont+'"]');
 let ps=[];
 if(el){ps=[...el.querySelectorAll('p')].map(x=>x.textContent.trim()).filter(Boolean);
  if(!ps.length)ps=el.textContent.split(/\n+/).map(x=>x.trim()).filter(Boolean)}
 if(!ps.length)ps=[...doc.querySelectorAll('p')].map(x=>x.textContent.trim()).filter(x=>x.length>1);
 if(!ps.length)throw new Error('Texte du chapitre introuvable (classe « '+(c.cont||'')+' »).');
 return{paras:ps}}

// ---------- interface
function open(){
 readAdv();const c=cfg();let tab='browse',term='',view={k:'browse'},selB=null,selS=null;
 // filtres de l'écran courant : Parcourir (liste), ou Recherche quand un mot est tapé
 const flist=()=>(c.filters||[]).filter(f=>term?f.where!='browse':f.where!='search');
 const defs=a=>{const o={};a.forEach(f=>o[f.key]=f.default);return o};
 const cur=()=>term?(selS||(selS=defs(flist()))):(selB||(selB=defs(flist())));
 function frame(){
  dlg.innerHTML=`<div class="top"><b>📱 Aperçu sur liseuse</b><button class="b s" id="pvx">Fermer</button></div>
  <p class="note">Maquette en niveaux de gris avec les vraies données du site et tes réglages actuels. Le rendu exact se vérifie dans KOReader.</p>
  <div class="rd"><div class="scr"><div class="hd" id="pvh"></div><div class="bd" id="pvb"></div>
  <div class="tabs"><button data-t="lib">Bibliothèque</button><button data-t="browse">Parcourir</button><button data-t="src">Sources</button></div></div></div>`;
  dlg.querySelector('#pvx').onclick=()=>dlg.close();
  dlg.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view={k:tab=='browse'?'browse':tab};draw()})}
 const fixBtn=()=>{const f=dlg.querySelector('#pvfix');if(f)f.onclick=()=>{dlg.close();const h=document.getElementById('helpbox');if(h){h.open=true;h.scrollIntoView({behavior:'smooth'})}}};
 const hd=(t,sub,back)=>{const h=dlg.querySelector('#pvh');h.innerHTML=(back?'<button class="btn" id="pvback">←</button>':'')+'<span>'+H(t)+(sub?' <small>'+H(sub)+'</small>':'')+'</span>';
  if(back)h.querySelector('#pvback').onclick=back};
 const body=h=>{dlg.querySelector('#pvb').innerHTML=h;return dlg.querySelector('#pvb')};
 dlg.querySelectorAll('.tabs button').forEach(()=>{});
 async function draw(){
  dlg.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  try{
   if(view.k=='lib'){hd('Bibliothèque');body('<div class="pad sum">Ta bibliothèque est vide.<br>Ajoute une œuvre depuis Parcourir.</div>')}
   else if(view.k=='src'){hd('Sources');const b=body(`<div class="row"><div class="tile">${H(initials(c.name))}</div><div><b>${H(c.name)}</b><small>${H(c.lang)} · ${H(c.base)}</small></div><span style="margin-left:auto;font-size:20px">⬇</span></div><div class="pad sum">Voilà comment la source apparaîtra dans l'onglet Sources avant son installation.</div>`)}
   else if(view.k=='filters'){
    // panneau de filtres comme dans le plugin : liste à choix unique, cases à cocher pour « plusieurs choix »
    hd('Filtrer',null,()=>{view={k:'browse'};draw()});
    const FL=flist(),w=view.work||cur();
    const b=body(`<div class="pad">${FL.map((f,i)=>`<div class="fg"><b>${H(f.label)}</b>${f.multi?' <small>(plusieurs choix)</small>':''}${f.options.map((o,j)=>{const on=f.multi?String(w[f.key]||'').split(',').includes(o.id):w[f.key]===o.id;return `<label><input type="${f.multi?'checkbox':'radio'}" name="pf${i}" data-i="${i}" data-j="${j}" ${on?'checked':''}> ${H(o.label)}</label>`}).join('')}</div>`).join('')}</div><div class="nav"><button class="btn" id="pvc">Annuler</button><button class="btn" id="pva">Appliquer</button></div>`);
    b.querySelector('#pvc').onclick=()=>{view={k:'browse'};draw()};
    b.querySelector('#pva').onclick=()=>{const s=cur();
     FL.forEach((f,i)=>{const ck=[...b.querySelectorAll('input[data-i="'+i+'"]:checked')].map(x=>f.options[+x.dataset.j].id);s[f.key]=f.multi?ck.join(','):(ck[0]??f.default)});
     view={k:'browse'};draw()}}
   else if(view.k=='browse'){
    hd('Parcourir',c.name);
    const FL=flist(),b=body('<div class="srch"><input id="pvq" placeholder="Rechercher…"><button id="pvs">OK</button>'+(FL.length?'<button id="pvf" title="Filtres">⚙ Filtres</button>':'')+'</div><div id="pvu"></div><div id="pvl"><div class="ld">⏳ Chargement…</div></div>');
    b.querySelector('#pvq').value=term;
    const go=()=>{term=b.querySelector('#pvq').value.trim();draw()};
    b.querySelector('#pvs').onclick=go;b.querySelector('#pvq').onkeydown=e=>{if(e.key=='Enter')go()};
    const pf=b.querySelector('#pvf');if(pf)pf.onclick=()=>{view={k:'filters',work:{...cur()}};draw()};
    const R=await loadList(c,term,cur()),L=R.items,l=b.querySelector('#pvl');
    if(FL.length||c.browse){const u=b.querySelector('#pvu');u.className='url';u.textContent=(R.paste?'(code collé) ':'🔗 ')+R.url}
    if(!L.length){l.innerHTML='<div class="err">Aucune œuvre reconnue'+(term?' pour « '+H(term)+' »':(c.browse?' avec ces filtres':' sur l\'accueil'))+'.<br><br>Pas de panique : ferme l\'aperçu et colle le code de cette page dans « 🆘 Ça ne marche pas ? »'+(c.browse&&!term?' (choisis « Une page de liste avec un filtre appliqué »)':'')+'.<br><br><button class="btn" id="pvfix">Fermer et corriger</button></div>';fixBtn();return}
    l.innerHTML=L.map((x,i)=>`<div class="row" data-i="${i}">${x.cover?`<img src="${H(x.cover)}" referrerpolicy="no-referrer" alt="">`:'<div class="tile" style="border-radius:0;height:62px">'+H(initials(x.name))+'</div>'}<div><b>${H(x.name)}</b></div></div>`).join('');
    l.querySelectorAll('.row').forEach(r=>r.onclick=()=>{view={k:'detail',item:L[r.dataset.i]};draw()})}
   else if(view.k=='detail'){
    hd('Fiche',null,()=>{view={k:tab=='browse'?'browse':tab};draw()});
    body('<div class="ld">⏳ Chargement de la fiche…</div>');
    const n=view.nov||(view.nov=await loadNovel(c,view.item.path));
    const b=body(`<div class="pad">${n.cover||view.item.cover?`<img class="cv" referrerpolicy="no-referrer" src="${H(n.cover||view.item.cover)}" alt="">`:''}<h3>${H(n.name)}</h3><div class="sum">${H(n.summary||'(pas de description)')}</div><div style="clear:both"></div></div><div class="pad" style="padding-bottom:2px"><b style="font:700 14px system-ui">${n.chapters.length} chapitre(s)</b></div>${n.chapters.length?n.chapters.slice(0,60).map((x,i)=>`<div class="ch" data-i="${i}">${H(x.name)}</div>`).join(''):'<div class="err">Aucun chapitre trouvé.<br><br>Ferme l\'aperçu et colle le code de la page d\'une œuvre dans « 🆘 Ça ne marche pas ? ».<br><br><button class="btn" id="pvfix">Fermer et corriger</button></div>'}${n.chapters.length>60?'<div class="ch" style="color:#555">… '+(n.chapters.length-60)+' autres</div>':''}`);
    fixBtn();
    b.querySelectorAll('.ch[data-i]').forEach(r=>r.onclick=()=>{view={k:'read',nov:n,i:+r.dataset.i,item:view.item};draw()})}
   else if(view.k=='read'){
    const ch=view.nov.chapters[view.i];
    hd(ch.name.slice(0,28),null,()=>{view={k:'detail',item:view.item,nov:view.nov};draw()});
    body('<div class="ld">⏳ Chargement du chapitre…</div>');
    const r=await loadChapter(c,ch.path);
    const has=j=>view.nov.chapters[j];
    const b=body(`<div class="pad txt">${r.images?r.images.map(u=>`<img src="${H(u)}" referrerpolicy="no-referrer" alt="">`).join(''):r.paras.map(p=>'<p>'+H(p)+'</p>').join('')}</div><div class="nav"><button class="btn" id="pvp" ${has(view.i-1)?'':'disabled'}>« Précédent</button><button class="btn" id="pvn" ${has(view.i+1)?'':'disabled'}>Suivant »</button></div>`);
    b.parentElement.scrollTop=0;
    const mv=d=>()=>{view={...view,i:view.i+d};draw()};
    b.querySelector('#pvp').onclick=mv(-1);b.querySelector('#pvn').onclick=mv(1)}
  }catch(e){body('<div class="err">✘ '+H(e.message||String(e))+'<br><br>Pas de panique : ferme l\'aperçu, ouvre « 🆘 Ça ne marche pas ? » sous les tests et colle le code de la page concernée. Je corrigerai les réglages pour toi.<br><br><button class="btn" id="pvfix">Fermer et corriger</button></div>');fixBtn()}}
 frame();draw();dlg.showModal()}

window.openPreview=open;
})();

</script>
</body></html>
